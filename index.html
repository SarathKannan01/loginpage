<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="login-container">
       <h2>Login</h2>
       <form>
            <div class="input">
              <label for="name">Name</label>
              <input type="name" id="name" placeholder="Enter Your name" required>
           </div>
           <div class="input">
              <label for="email">Email</label>
              <input type="email" id="email" placeholder="Enter Your Email" required>
           </div>
           <div class="input">
              <label for="password">Password</label>
              <input type="password" id="password" placeholder="Enter Your password" required maxlength="8">
           </div>
            
           <button type="submit" class="login-btn" >Login</button>
           <div class="extra-link">
             <a href="#">Forget Password?</a>|
             <a href="#">SignUp</a>
           </div>
           <div class="social-login">
            <p>or login with</p>
            <button type="button" class="social-btn google-btn">Login With Google</button>
            <button type="button" class="social-btn Facebook-btn">Login With Facebook</button>
           </div>
       </form>
    </div>
</body>
</html>
